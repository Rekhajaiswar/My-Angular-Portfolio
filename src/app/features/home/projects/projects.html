<section id="projects">
@for (project of projects; track project.projectTitle) {
  <section id="project-card">
    <h2>{{ project.projectTitle }}</h2>
    <p>{{ project.web }}</p>
    <img [src]="'Ecommerce.png'" [alt]="project.projectTitle">
    <img [src]="'tick.png'" [alt]="project.projectTitle">
    <p>{{ project.technologies.join(', ') }}</p>
    <p>{{ project.liveUrl }}</p>
    <p>{{ project.githubUrl }}</p>
  </section>
}

</section>
