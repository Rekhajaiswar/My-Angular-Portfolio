<section id="hero" class="hero-section">
  <div class="hero-content">
    <span class="welcome-text">Hello, I'm</span>
    <h1>{{name}}</h1>
    <h2>{{role}}</h2>
    <p class="hero-description">  {{description}}</p>

      <!--button section-->
      <div class="hero-btns">
       <button class="button button-filled" (click)="viewWork()">{{btn}}</button>
       <button class="button button-outline" (click)="downloadCV()">{{resume}}</button>
    </div>
  </div>

  <div class="hero-image-container">
    <img src="image.png" alt="RJ Avatar" class="animated-avatar">
      </div>


</section>
