<section id="home" class="hero-section">
  <div class="hero-content">
    <span class="welcome-text">{{ welcome }}</span>
    <h1>{{ name }}</h1>
    <h2>{{ role }}</h2>
    <p class="hero-description">{{ description }}</p>

    <!--button section-->
    <div class="hero-btns">
      <button class="button button-filled" (click)="viewWork()">{{ btn }}</button>
      <a href="assets/Rekhajaiswar...pdf" download>
        <button class="button button-outline">Download CV</button>
      </a>
    </div>
  </div>

  <div class="hero-image-container">
    <img [src]="imgUrl" alt="RJ Avatar" class="animated-avatar" />
  </div>
</section>
