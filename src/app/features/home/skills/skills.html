<section id="skills" class="skills-section">
  <h2>My Skills</h2>
  <p class="skills-subtitle">Technologies I work with</p>

  <div class="skills-container">
    @for (skill of skills; track skill.name) {
      <div class="skill-card">
        <i [class]="skill.icon"></i>

        <p>{{ skill.name }}</p>
      </div>
    }
  </div>
</section>
